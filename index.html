<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="WordForge - A modern word puzzle and statistics platform."
    >

    <title>WordForge - Word Puzzle</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================== HEADER ==================== -->
    <header class="site-header">

        <div class="header-container">

            <a href="index.html" class="logo">
                WordForge
            </a>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html" class="nav-link active">
                    Game
                </a>

                <a href="dashboard.html" class="nav-link">
                    Dashboard
                </a>
            </nav>

        </div>

    </header>


    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="main-content">

        <!-- Game introduction -->
        <section class="game-intro">

            <p class="game-mode">
                DAILY CHALLENGE
            </p>

            <h1>Guess the Word</h1>

            <p class="game-description">
                Find the hidden five-letter word in six attempts.
            </p>

        </section>


        <!-- ==================== GAME BOARD ==================== -->
        <section
            class="game-section"
            aria-label="Word guessing game"
        >

            <div
                id="game-board"
                class="game-board"
                aria-label="Game board"
            >

                <!-- Row 1 -->
                <div class="guess-row">
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                </div>

                <!-- Row 2 -->
                <div class="guess-row">
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                </div>

                <!-- Row 3 -->
                <div class="guess-row">
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                </div>

                <!-- Row 4 -->
                <div class="guess-row">
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                </div>

                <!-- Row 5 -->
                <div class="guess-row">
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                </div>

                <!-- Row 6 -->
                <div class="guess-row">
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                    <div class="letter-tile"></div>
                </div>

            </div>

        </section>


        <!-- ==================== MESSAGE ==================== -->
        <section
            id="game-message"
            class="game-message"
            aria-live="polite"
        >
            <p>Start guessing!</p>
        </section>


        <!-- ==================== KEYBOARD ==================== -->
        <section
            class="keyboard-section"
            aria-label="Virtual keyboard"
        >

            <div class="keyboard-row">

                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">T</button>
                <button class="key" data-key="Y">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>

            </div>


            <div class="keyboard-row">

                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>

            </div>


            <div class="keyboard-row">

                <button
                    class="key key-wide"
                    data-key="ENTER"
                >
                    ENTER
                </button>

                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>

                <button
                    class="key key-wide"
                    data-key="BACKSPACE"
                    aria-label="Backspace"
                >
                    ←
                </button>

            </div>

        </section>


        <!-- ==================== PRACTICE MODE ==================== -->
        <section class="practice-section">

            <p>
                Want to keep playing?
            </p>

            <button
                id="practice-button"
                class="secondary-button"
                type="button"
            >
                Practice Mode
            </button>

        </section>

    </main>


    <!-- ==================== FOOTER ==================== -->
    <footer class="site-footer">

        <p>
            &copy; 2026 WordForge. Built with HTML, CSS &amp; JavaScript.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/game.js"></script>

</body>
</html>
